# ============================================
# GRUB.CFG - Configuração do Bootloader
# Archiso - Arch Linux Customizado
# ============================================

set default=0
set timeout=5

# Cores do menu
set menu_color_normal=cyan/blue
set menu_color_highlight=white/blue

# Entrada principal - Ravena Security Sandbox
menuentry "Ravena Security Sandbox" {
    set root=(hd0,msdos1)
    linux /boot/vmlinuz-linux \
        archisobasedir=ravena \
        archisolabel=RAVENA \
        root=/dev/loop0 \
        rw \
        quiet \
        splash \
        loglevel=3
    initrd /boot/initramfs-linux.img
}

# Entrada de recuperação
menuentry "Ravena - Modo Recuperação" {
    set root=(hd0,msdos1)
    linux /boot/vmlinuz-linux \
        archisobasedir=ravena \
        archisolabel=RAVENA \
        root=/dev/loop0 \
        rw \
        quiet \
        splash \
        loglevel=3 \
        systemd.unit=rescue.target
    initrd /boot/initramfs-linux.img
}

# Entrada de shell
menuentry "Ravena - Shell" {
    set root=(hd0,msdos1)
    linux /boot/vmlinuz-linux \
        archisobasedir=ravena \
        archisolabel=RAVENA \
        root=/dev/loop0 \
        rw \
        quiet \
        splash \
        loglevel=3 \
        systemd.unit=emergency.target
    initrd /boot/initramfs-linux.img
}
