# ============================================
# CONFIGURAÇÃO DO ALERTMANAGER
# ============================================

# ============================================
# GLOBAL
# ============================================
global:
  resolve_timeout: 5m

# ============================================
# ROUTING
# ============================================
route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'
  
  routes:
    - match:
        severity: critical
      receiver: 'critical.alerts'
      group_wait: 10s
      
    - match:
        severity: high
      receiver: 'high.alerts'
      
    - match:
        severity: medium
      receiver: 'medium.alerts'

# ============================================
# RECEIVERS
# ============================================
receivers:
  - name: 'web.hook'
    webhook_configs:
      - url: 'http://ravena-app:5001/webhook/'
        send_resolved: true

  - name: 'critical.alerts'
    webhook_configs:
      - url: 'http://ravena-app:5001/webhook/critical/'
        send_resolved: true

  - name: 'high.alerts'
    webhook_configs:
      - url: 'http://ravena-app:5001/webhook/high/'
        send_resolved: true

  - name: 'medium.alerts'
    webhook_configs:
      - url: 'http://ravena-app:5001/webhook/medium/'
        send_resolved: true

# ============================================
# INHIBITION RULES
# ============================================
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
