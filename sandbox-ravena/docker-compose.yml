version: '3.8'

services:
  # Servidor principal da Ravena
  ravena-app:
    build:
      context: .
      dockerfile: Dockerfile.ravena
    container_name: ravena-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=sandbox
      - DB_HOST=ravena-db
      - DB_PORT=5432
      - DB_NAME=ravena_sandbox
      - DB_USER=ravena_test
      - DB_PASS=sandbox_password_123
      - JWT_SECRET=sandbox_jwt_secret_key
      - REDIS_URL=redis://ravena-redis:6379
    networks:
      - ravena-sandbox
    depends_on:
      - ravena-db
      - ravena-redis
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Banco de dados PostgreSQL
  ravena-db:
    image: postgres:15-alpine
    container_name: ravena-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ravena_sandbox
      - POSTGRES_USER=ravena_test
      - POSTGRES_PASSWORD=sandbox_password_123
    ports:
      - "5432:5432"
    networks:
      - ravena-sandbox
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
      - ./logs/postgres:/var/log/postgresql
    command: >
      postgres
        -c log_statement=all
        -c log_connections=on
        -c log_disconnections=on
        -c log_duration=on
        -c log_hostname=on
        -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h'

  # Redis para cache e sessões
  ravena-redis:
    image: redis:7-alpine
    container_name: ravena-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ravena-sandbox
    command: redis-server --loglevel verbose --logfile /var/log/redis/redis.log
    volumes:
      - ./logs/redis:/var/log/redis

  # Nginx Reverse Proxy
  ravena-nginx:
    image: nginx:alpine
    container_name: ravena-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ravena-sandbox
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - ravena-app

  # Monitoramento e Logs
  ravena-monitor:
    image: grafana/grafana:latest
    container_name: ravena-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=sandbox_monitor_123
    networks:
      - ravena-sandbox
    volumes:
      - ./logs:/var/logs
      - ./monitoring/grafana:/var/lib/grafana

  # ELK Stack para análise de logs
  ravena-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.0
    container_name: ravena-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - ravena-sandbox
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data

  ravena-kibana:
    image: docker.elastic.co/kibana/kibana:8.10.0
    container_name: ravena-kibana
    ports:
      - "5601:5601"
    networks:
      - ravena-sandbox
    depends_on:
      - ravena-elasticsearch

networks:
  ravena-sandbox:
    driver: bridge
    internal: true  # Sem acesso externo

volumes:
  postgres-data:
  elasticsearch-data:
