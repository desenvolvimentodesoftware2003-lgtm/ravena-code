events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format detalhado para auditoria
    log_format audit '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     '$request_time $upstream_response_time '
                     '"$request_body"';

    # Log de acesso
    access_log /var/log/nginx/access.log audit;
    error_log /var/log/nginx/error.log debug;

    # Configurações de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting para detecção de força bruta
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Upstream para o servidor da Ravena
    upstream ravena_backend {
        server ravena-app:8080;
    }

    # ============================================
    # SERVIDOR HTTP - Redireciona para HTTPS
    # ============================================
    server {
        listen 80;
        server_name localhost;
        
        # Redirecionar tudo para HTTPS
        return 301 https://$host$request_uri;
    }

    # ============================================
    # SERVIDOR HTTPS - Principal
    # ============================================
    server {
        listen 443 ssl http2;
        server_name localhost;

        # Certificados SSL (autoassinados para sandbox)
        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # Configurações SSL de segurança
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Logs de audit trail
        access_log /var/log/nginx/audit_access.log audit;

        # Headers de segurança
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;

        # Login - Rate limiting rigoroso
        location /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://ravena_backend;
            proxy_set_header X-Attack-Type "brute_force_detection";
        }

        # API geral
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://ravena_backend;
        }

        # Slots - Monitoramento especial
        location /api/slots/ {
            proxy_pass http://ravena_backend;
            proxy_set_header X-Module "slots";
            proxy_set_header X-Monitor "enabled";
        }

        # Saques - Log completo
        location /api/withdrawals/ {
            proxy_pass http://ravena_backend;
            proxy_set_header X-Module "withdrawals";
            proxy_set_header X-Audit "critical";
            client_body_buffer_size 128k;
        }

        # Health check
        location /health {
            proxy_pass http://ravena_backend;
        }

        # Dashboard (arquivo estático)
        location /dashboard {
            alias /var/www/dashboard;
            index dashboard.html;
        }

        # Bloquear tentativas de path traversal
        location ~* \.\./ {
            deny all;
            return 403;
            access_log /var/log/nginx/path_traversal.log audit;
        }
    }
}
