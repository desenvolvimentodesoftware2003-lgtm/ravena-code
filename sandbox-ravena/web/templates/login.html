<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravena - Login</title>
    <link rel="stylesheet" href="/static/css/ravena.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-shield-halved"></i>
                <h1>Ravena</h1>
                <p>Sandbox de Segurança</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="username">
                        <i class="fas fa-user"></i> Usuário
                    </label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Digite seu usuário">
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Digite sua senha">
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-right-to-bracket"></i> Entrar
                </button>
            </form>

            <div class="login-footer">
                <p><i class="fas fa-shield-halved"></i> Criptografia Pós-Quântica Ativa</p>
                <p><i class="fas fa-lock"></i> TLS 1.3 | Sessão 90 dias</p>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
