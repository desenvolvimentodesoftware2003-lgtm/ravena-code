[project]
name = "ravena-aim"
version = "3.2.6"
description = "Ravena AIM — Sistema Cognitivo Modular de Trading"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
